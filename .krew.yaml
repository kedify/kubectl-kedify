apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kedify
spec:
  version: "v0.0.12"
  homepage: https://github.com/kedify/kubectl-kedify
  shortDescription: "Inspect, troubleshoot, and configure autoscaling with Kedify."
  description: |
    Provides commands for inspecting Kedify status and logs, configuring HTTP
    autoscaling, managing multicluster configuration, analyzing scaling
    configurations, and collecting diagnostic data.
  platforms:
    - selector:
        matchExpressions:
          - key: "os"
            operator: "In"
            values:
              - darwin
              - linux
      uri: https://github.com/kedify/kubectl-kedify/archive/refs/tags/v0.0.12.zip
      # 'sha256' is the sha256sum of the zip from url above (shasum -a 256 ..zip)
      sha256: 0f21dc43b73afbc583ae0de52d82a16a9fb933376c5ca5dd5af568c830713a45
      # {{addURIAndSha "https://github.com/kedify/kubectl-kedify/releases/download/{{ .TagName }}/kubectl-kedify{{ .TagName }}.tar.gz" .TagName }}
      files:
        - from: "kubectl-kedify-*/kubectl-kedify"
          to: "."
        - from: "kubectl-kedify-*/preview-functions.sh"
          to: "."
        - from: "kubectl-kedify-*/insights.sh"
          to: "."
        - from: "kubectl-kedify-*/dump.sh"
          to: "."
        - from: "kubectl-kedify-*/LICENSE"
          to: "."
        - from: "kubectl-kedify-*/hso.yaml"
          to: "."
        - from: "kubectl-kedify-*/so.yaml"
          to: "."
        - from: "kubectl-kedify-*/VERSION"
          to: "."
        - from: "kubectl-kedify-*/README.md"
          to: "."
        - from: "kubectl-kedify-*/debug.sh"
          to: "."
        - from: "kubectl-kedify-*/multicluster.sh"
          to: "."
      bin: kubectl-kedify
